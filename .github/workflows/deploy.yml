name: Deploy new release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      # prepare builds lib/; prepublishOnly runs the build and tests.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
      - name: Create GitHub release for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          gh release create "v${PACKAGE_VERSION}" --target "$GITHUB_SHA" --title "Release v${PACKAGE_VERSION}" --generate-notes
