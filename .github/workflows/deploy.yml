name: Deploy new release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      # prepare builds lib/; prepublishOnly runs the build and tests.
      - run: npm publish
      - name: Create GitHub release for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          gh release create "v${PACKAGE_VERSION}" --target "$GITHUB_SHA" --title "Release v${PACKAGE_VERSION}" --generate-notes
